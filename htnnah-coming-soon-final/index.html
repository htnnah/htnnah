<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hannah Young</title>

  <style>
    :root {
      --cream: #f5ede2;
      --dot: #ffd2a7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      background: #6d4d4f;
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      min-height: 100svh;
      width: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: -3%;
      z-index: -3;
      background: url("background.png") center center / cover no-repeat;
      transform: scale(1.035);
      animation: slow-drift 26s ease-in-out infinite alternate;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 47%, transparent 18%, rgba(18, 11, 18, .08) 65%, rgba(18, 11, 18, .18) 100%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(92vw, 1050px);
      padding: clamp(20px, 4vw, 48px);
      text-align: center;
      transform: translateY(-1vh);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4.1rem, 10vw, 9.2rem);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.055em;
      color: var(--cream);
      text-wrap: balance;
      text-shadow: 0 8px 28px rgba(0,0,0,.22);
    }

    .message {
      margin: 28px 0 0;
      font-size: clamp(.82rem, 1.45vw, 1.08rem);
      font-weight: 400;
      letter-spacing: .34em;
      line-height: 1.6;
      text-transform: lowercase;
      color: rgba(245, 237, 226, .9);
      text-shadow: 0 4px 16px rgba(0,0,0,.2);
    }

    .loader {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .loader span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255, 238, 222, .62);
      background: transparent;
      opacity: .55;
      animation: dot-pulse 1.35s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: .18s; }
    .loader span:nth-child(3) { animation-delay: .36s; }

    @keyframes dot-pulse {
      0%, 60%, 100% {
        opacity: .45;
        background: transparent;
        box-shadow: none;
        transform: scale(.92);
      }
      30% {
        opacity: 1;
        background: var(--dot);
        border-color: var(--dot);
        box-shadow:
          0 0 12px rgba(255, 184, 125, .9),
          0 0 24px rgba(255, 160, 95, .42);
        transform: scale(1.08);
      }
    }

    @keyframes slow-drift {
      from { transform: scale(1.035) translate3d(-.35%, 0, 0); }
      to   { transform: scale(1.055) translate3d(.35%, -.25%, 0); }
    }

    @media (max-width: 700px) {
      .background {
        background-position: center center;
      }

      .content {
        width: 94vw;
        padding-inline: 18px;
      }

      h1 {
        font-size: clamp(3.3rem, 16vw, 6.2rem);
        letter-spacing: -.045em;
      }

      .message {
        margin-top: 22px;
        letter-spacing: .2em;
        font-size: .78rem;
      }

      .loader {
        margin-top: 18px;
        gap: 11px;
      }

      .loader span {
        width: 9px;
        height: 9px;
      }
    }

    @media (max-height: 620px) {
      .content {
        transform: translateY(0);
      }

      h1 {
        font-size: clamp(3rem, 12vh, 6rem);
      }

      .message {
        margin-top: 16px;
      }

      .loader {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .background,
      .loader span {
        animation: none;
      }

      .loader span:first-child {
        opacity: 1;
        background: var(--dot);
        border-color: var(--dot);
        box-shadow: 0 0 16px rgba(255, 184, 125, .7);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="background" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>

    <section class="content">
      <h1>Hannah Young</h1>
      <p class="message">working on something special</p>

      <div class="loader" aria-label="Loading">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>
</body>
</html>
