<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannah Young</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #A0D2EB;
    --mist: #E5EAF5;
    --lilac: #D0BDF4;
    --purple: #8458B3;
    --ink: #494D5F;
    --amber: #d9b08c;
    --cobalt: #1d4ea1;
    --lava: #ff7a3d;
    --ease: cubic-bezier(.7, 0, .2, 1);
    --font: "Italianno", "New Berolina", "Snell Roundhand", "Apple Chancery", "Segoe Script", cursive;
  }
  html { font-size: 150%; font-synthesis: none; }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--sky) linear-gradient(180deg, var(--sky) 0%, var(--lilac) 100%) fixed; }
  body { background: none; color: var(--ink); font-family: var(--font); }
  body { min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--purple); outline-offset: 4px; border-radius: 12px; }

  /* nav: each group sits on a frosted light block so it stays readable over dark or light content */
  nav { position: fixed; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 16px 32px; z-index: 5; pointer-events: none; }
  nav .brand, nav ul { pointer-events: auto; background: rgba(229, 234, 245, .86); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
        border-radius: 999px; box-shadow: 0 8px 22px rgba(73, 77, 95, .22), inset 0 0 0 1px rgba(255, 255, 255, .6); }
  nav .brand { font-weight: 700; letter-spacing: 0; font-size: 1.7rem; padding: 6px 28px 10px; color: var(--ink); }
  nav ul { display: flex; gap: 34px; list-style: none; margin: 0; padding: 6px 30px 10px; }
  nav ul a { font-size: 1.7rem; color: var(--ink); opacity: .85; padding-bottom: 2px; border-bottom: 2px solid transparent; transition: opacity .2s, border-color .2s; }
  nav ul a:hover, nav ul a[aria-current="page"] { opacity: 1; border-color: var(--purple); }

  /* pages */
  #view { min-height: 100vh; padding: 130px 36px 80px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: clamp(2.4rem, 6vw, 4.5rem); line-height: 1.05; font-weight: 800; margin-bottom: 20px; }
  h2 { font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 12px; }
  p.lead { max-width: 50ch; line-height: 1.5; opacity: .95; font-size: 1.25rem; }
  .backlink { display: inline-block; margin-bottom: 28px; opacity: .7; }
  .backlink:hover { opacity: 1; }
  .ph { background: var(--mist); border: 2px dashed rgba(73,77,95,.3); border-radius: 18px;
        display: grid; place-items: center; text-align: center; padding: 20px; opacity: .8; min-height: 220px; }

  /* home */
  .home { min-height: calc(100vh - 190px); display: grid; place-content: center; text-align: center; }
  .home h1 { font-size: clamp(3.5rem, 12vw, 9rem); line-height: 1; margin-bottom: 32px; color: var(--purple); }
  .home h1 span { display: block; overflow: hidden; padding: .05em .2em .3em; margin: 0 -.2em -.3em; }
  .home h1 span i { display: inline-block; font-style: normal; transform: translateY(105%); animation: rise .9s var(--ease) forwards; }
  .home h1 span:nth-child(2) i { animation-delay: .12s; }
  @keyframes rise { to { transform: none; } }
  .tag { letter-spacing: 0; font-size: 1.3rem; opacity: .9; }
  .enter { display: inline-block; margin-top: 40px; padding: 10px 44px 14px; font-size: 2rem; line-height: 1.2; border-radius: 999px; border: 2px solid var(--purple);
           transition: background .25s, color .25s; }
  .enter:hover { background: var(--purple); color: var(--mist); }

  /* loves hub */
  .hub { display: grid; gap: 18px; margin-top: 36px; }
  .hub a { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 32px; border-radius: 24px;
           background: var(--mist); font-size: clamp(1.4rem, 3.4vw, 2.4rem); font-weight: 700;
           transition: transform .3s var(--ease), background .3s; }
  .hub a small { font-size: 1rem; font-weight: 400; opacity: .65; }
  .hub a:hover { transform: translateX(10px); background: var(--lilac); }

  /* travel cards */
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 70px 28px; margin-top: 36px; }
  .cards .card { flex: 0 0 calc((100% - 84px) / 4); align-self: flex-start; }
  @media (min-width: 1620px) { #view.wide { max-width: 1500px; } .cards .card { flex-basis: calc((100% - 140px) / 6); } }
  @media (max-width: 920px) { .cards { gap: 62px 20px; } .cards .card { flex-basis: calc((100% - 40px) / 3); } }
  @media (max-width: 640px) { .cards { gap: 56px 16px; } .cards .card { flex-basis: calc((100% - 16px) / 2); } }

  .card { position: relative; aspect-ratio: 1; border-radius: 28px; display: block; perspective: 900px; }
  .card .label { position: absolute; left: 0; right: 0; top: 100%; margin-top: 8px; text-align: center; font-weight: 600; font-size: 1.15rem; line-height: 1.1; }

  /* portugal: 3D flipping tile */
  .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s var(--ease); }
  .card.flipped .flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          box-shadow: 0 14px 34px rgba(73,77,95,.35); }
  .face.back { container-type: inline-size; transform: rotateY(180deg); background: var(--mist); color: var(--ink); display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .face .photo { flex: 0 0 40%; border-radius: 16px; border: 2px dashed rgba(73,77,95,.3); display: grid; place-items: center; text-align: center; font-size: 1.05rem; opacity: .9; }
  .face .desc { flex: 0 0 auto; font-size: 1.1rem; line-height: 1.25; opacity: .95; }
  .ph-front { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--mist); border: 2px dashed rgba(73,77,95,.3); border-radius: 28px; }
  .face svg { width: 100%; height: 100%; display: block; }

  /* guatemala: erupting volcano */
  .card.gt .front { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: linear-gradient(#1b1830, #4a2f4c 70%, #7a4150);
                    box-shadow: 0 14px 34px rgba(73,77,95,.35); }
  .card.gt .front::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s;
                           background: radial-gradient(circle at 42% 28%, rgba(255,140,60,.4), rgba(255,90,40,.1) 45%, transparent 70%); }
  .card.gt.erupt .front::after{ opacity: 1; }
  .card.gt svg { width: 100%; height: 100%; display: block; }
  .card.gt.erupt svg{ animation: rumble .1s linear infinite; }
  @keyframes rumble { 0% { transform: translate(0,0); } 25% { transform: translate(1.5px,-1px); } 50% { transform: translate(-1px,1.5px); } 75% { transform: translate(-1.5px,-1px); } 100% { transform: translate(0,0); } }

  .crater-glow { opacity: .25; transition: opacity .4s; }
  .card.gt.erupt .crater-glow{ opacity: 1; }
  .smoke { fill: rgba(220,205,215,.16); transition: transform 1s var(--ease); transform-box: fill-box; transform-origin: center; }
  .card.gt.erupt .smoke{ transform: translateY(-18px) scale(1.45); }

  .flow { fill: none; stroke-linecap: round; stroke-dasharray: 100 200; stroke-dashoffset: 108; transition: stroke-dashoffset 1.6s cubic-bezier(.2,.7,.3,1); }
  .flow.core { stroke: #ffb347; stroke-width: 3; }
  .flow.halo { stroke: #ff5a28; stroke-width: 9; opacity: .4; }
  .card.gt.erupt .flow{ stroke-dashoffset: 0; }

  .jet, .flash { opacity: 0; transform-box: view-box; transform-origin: 84px 47px; }
  .card.gt.erupt .jet{ animation: jet .55s ease-in-out infinite alternate; }
  .card.gt.erupt .flash{ animation: flash 1.5s ease-out infinite; }
  @keyframes jet { from { opacity: .85; transform: scale(.85, .6); } to { opacity: 1; transform: scale(1.05, 1.15); } }
  @keyframes flash { 0% { opacity: .95; transform: scale(.2); } 100% { opacity: 0; transform: scale(2.4); } }

  .bx { }
  .bomb { opacity: 0; }
  .card.gt.erupt .bx{ animation: bx var(--t) linear infinite; animation-delay: var(--d); }
  .card.gt.erupt .bomb{ animation: by var(--t) infinite; animation-delay: var(--d); }
  @keyframes bx { from { transform: translateX(0); } to { transform: translateX(var(--dx)); } }
  @keyframes by {
    0%   { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.15,.75,.4,1); }
    42%  { transform: translateY(calc(var(--h) * -1px)); opacity: 1; animation-timing-function: cubic-bezier(.55,0,.9,.6); }
    100% { transform: translateY(calc(var(--f) * 1px)); opacity: 0; }
  }


  /* placeholder cards (greece, hungary, austria) */
  .card.plain .scene { position: absolute; inset: 0; border-radius: 28px; display: grid; place-items: center; text-align: center; padding: 20px;
                       background: var(--mist); border: 2px dashed rgba(73,77,95,.3); transition: transform .4s var(--ease); }
  .card.plain:is(:hover, .touch-on) .scene { transform: scale(1.04); }

  .card.gr .scene, .card.ch .scene, .card.at .scene, .card.mt .scene, .card.mx .scene { padding: 0; border: none; overflow: hidden; background: none; box-shadow: 0 14px 34px rgba(73,77,95,.35); }
  .card.gr .scene svg, .card.ch .scene svg, .card.at .scene svg, .card.mt .scene svg, .card.mx .scene svg { width: 100%; height: 100%; display: block; }
  .card.mx .wing { transform-box: view-box; transform-origin: 53px 83px; }
  .card.mx .flag { transform-box: fill-box; transform-origin: 50% 0; }
  .card.mx:is(:hover, .touch-on) .wing, .card.mx:is(:focus-visible, .touch-on) .wing { animation: flap .16s ease-in-out infinite alternate; }
  .card.mx:is(:hover, .touch-on) .wing.back, .card.mx:is(:focus-visible, .touch-on) .wing.back { animation-delay: -.08s; }
  .card.mx:is(:hover, .touch-on) .bird, .card.mx:is(:focus-visible, .touch-on) .bird { animation: flutter .45s ease-in-out infinite alternate; }
  .card.mx:is(:hover, .touch-on) .flag, .card.mx:is(:focus-visible, .touch-on) .flag { animation: swing .9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.14s); }
  .card.mx:is(:hover, .touch-on) .note, .card.mx:is(:focus-visible, .touch-on) .note { animation: float 2.4s ease-out infinite; animation-delay: calc(var(--i) * -.48s); }
  @keyframes flap { from { transform: rotate(14deg); } to { transform: rotate(-52deg); } }
  @keyframes flutter { from { transform: translate(0, 2px) rotate(-2deg); } to { transform: translate(5px, -5px) rotate(3deg); } }
  @keyframes swing { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes float { 0% { transform: translate(0, 4px); opacity: 0; } 15% { opacity: 1; } 60% { transform: translate(5px, -16px); } 100% { transform: translate(-3px, -34px); opacity: 0; } }
  .card.mt:is(:hover, .touch-on) .wave, .card.mt:is(:focus-visible, .touch-on) .wave { animation: rapid 2.6s linear infinite; }
  .card.mt:is(:hover, .touch-on) .w2, .card.mt:is(:focus-visible, .touch-on) .w2 { animation-duration: 2s; animation-direction: reverse; }
  .card.mt:is(:hover, .touch-on) .w3, .card.mt:is(:focus-visible, .touch-on) .w3 { animation-duration: 2.3s; }
  .card.mt:is(:hover, .touch-on) .w4, .card.mt:is(:focus-visible, .touch-on) .w4 { animation-duration: 1.7s; animation-direction: reverse; }
  @keyframes rapid { from { transform: translateX(0); } to { transform: translateX(-60px); } }
  .card.at .gondola { transform-box: view-box; transform-origin: 100px 60px; }
  .card.at:is(:hover, .touch-on) .gondola, .card.at:is(:focus-visible, .touch-on) .gondola { animation: sway 2.6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }
  .card.ch:is(:hover, .touch-on) .train, .card.ch:is(:focus-visible, .touch-on) .train { animation: ride 2.4s linear infinite; }
  @keyframes ride { from { transform: translateX(-150px); } to { transform: translateX(215px); } }

  /* greece: night at rest, the sun rises on hover */
  .gsun, .gmoon { transition: transform 1.8s var(--ease); }
  .gsun { transform: translateY(120px); }
  .gnight, .gstars { transition: opacity 1.8s ease; opacity: 1; }
  .gdusk { transition: opacity 1.8s ease; opacity: .34; pointer-events: none; }
  .card.gr:is(:hover, .touch-on) .gsun, .card.gr:is(:focus-visible, .touch-on) .gsun { transform: none; }
  .card.gr:is(:hover, .touch-on) .gmoon, .card.gr:is(:focus-visible, .touch-on) .gmoon { transform: translateY(120px); }
  .card.gr:is(:hover, .touch-on) .gnight, .card.gr:is(:hover, .touch-on) .gstars, .card.gr:is(:hover, .touch-on) .gdusk,
  .card.gr:is(:focus-visible, .touch-on) .gnight, .card.gr:is(:focus-visible, .touch-on) .gstars, .card.gr:is(:focus-visible, .touch-on) .gdusk { opacity: 0; }

  /* hungary: spa party */
  .card.hu .burst, .card.hu .spark { transform-box: fill-box; transform-origin: center; }
  .card.hu .beam { transform-box: view-box; }
  .card.hu:is(:hover, .touch-on) .win, .card.hu:is(:focus-visible, .touch-on) .win { animation: party 1.2s linear infinite; animation-delay: calc(var(--i) * -.17s); }
  .card.hu:is(:hover, .touch-on) .burst, .card.hu:is(:focus-visible, .touch-on) .burst { animation: spinpulse 3s linear infinite; }
  .card.hu:is(:hover, .touch-on) .beam, .card.hu:is(:focus-visible, .touch-on) .beam { animation: sweep 1.7s ease-in-out infinite alternate; }
  .card.hu:is(:hover, .touch-on) .beam.b2, .card.hu:is(:focus-visible, .touch-on) .beam.b2 { animation-direction: alternate-reverse; }
  .card.hu:is(:hover, .touch-on) .person, .card.hu:is(:focus-visible, .touch-on) .person { animation: bob .55s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.13s); }
  .card.hu:is(:hover, .touch-on) .steam, .card.hu:is(:focus-visible, .touch-on) .steam { animation: steam 2.4s ease-out infinite; animation-delay: calc(var(--i) * -.5s); }
  .card.hu:is(:hover, .touch-on) .spark, .card.hu:is(:focus-visible, .touch-on) .spark { animation: twinkle .7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.2s); }
  @keyframes party { 0% { fill: #3df5e0; } 25% { fill: #ff4fd8; } 50% { fill: #ffd84d; } 75% { fill: #7bff6b; } 100% { fill: #3df5e0; } }
  @keyframes spinpulse { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
  @keyframes sweep { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes steam { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .3; } 100% { transform: translateY(-22px); opacity: 0; } }
  @keyframes twinkle { from { transform: scale(.3); opacity: .3; } to { transform: scale(1.3); opacity: 1; } }

  /* spain: market + flamenco */
  .card.sp .dw, .card.sp .dm { transform-box: view-box; }
  .card.sp .dw { transform-origin: 92px 178px; }
  .card.sp .dm { transform-origin: 122px 178px; }
  .card.sp .skirt { transform-box: view-box; transform-origin: 92px 146px; }
  .card.sp .arm { transform-box: view-box; transform-origin: 98px 134px; }
  .card.sp .flag { transform-box: fill-box; transform-origin: 50% 0; }
  .card.sp:is(:hover, .touch-on) .dw, .card.sp:is(:focus-visible, .touch-on) .dw { animation: sway .7s ease-in-out infinite alternate; }
  .card.sp:is(:hover, .touch-on) .skirt, .card.sp:is(:focus-visible, .touch-on) .skirt { animation: swish .35s ease-in-out infinite alternate; }
  .card.sp:is(:hover, .touch-on) .arm, .card.sp:is(:focus-visible, .touch-on) .arm { animation: wave .35s ease-in-out infinite alternate; }
  .card.sp:is(:hover, .touch-on) .dm, .card.sp:is(:focus-visible, .touch-on) .dm { animation: stomp .35s ease-in-out infinite alternate; }
  .card.sp:is(:hover, .touch-on) .seller, .card.sp:is(:focus-visible, .touch-on) .seller { animation: bob .45s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.2s); }
  .card.sp:is(:hover, .touch-on) .flag, .card.sp:is(:focus-visible, .touch-on) .flag { animation: swing .9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.14s); }
  .card.sp:is(:hover, .touch-on) .note, .card.sp:is(:focus-visible, .touch-on) .note { animation: float 2.4s ease-out infinite; animation-delay: calc(var(--i) * -.8s); }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  @keyframes swish { from { transform: scaleX(.9); } to { transform: scaleX(1.14); } }
  @keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  @keyframes stomp { from { transform: translateY(0); } to { transform: translateY(-3.5px); } }

  /* portugal back + puerto rico */
  .face.back.art { padding: 0; display: block; background: none; }
  .card.pt.flipped .surf { animation: foam 1.4s linear infinite; }
  @keyframes foam { to { stroke-dashoffset: -44; } }
  .card.pr .crown, .card.pr .hm { transform-box: view-box; }
  .card.pr:is(:hover, .touch-on) .crown, .card.pr:is(:focus-visible, .touch-on) .crown { animation: rustle 1.5s ease-in-out infinite alternate; }
  .card.pr:is(:hover, .touch-on) .hm, .card.pr:is(:focus-visible, .touch-on) .hm { animation: hammock 1.9s ease-in-out infinite alternate; }
  .card.pr:is(:hover, .touch-on) .hm:nth-of-type(2), .card.pr:is(:focus-visible, .touch-on) .hm:nth-of-type(2) { animation-delay: -.9s; }
  .card.pr:is(:hover, .touch-on) .pwave, .card.pr:is(:focus-visible, .touch-on) .pwave { animation: pwave 3.2s linear infinite; }
  .card.pr:is(:hover, .touch-on) .p2, .card.pr:is(:focus-visible, .touch-on) .p2 { animation-duration: 4s; animation-direction: reverse; }
  .card.pr:is(:hover, .touch-on) .glint, .card.pr:is(:focus-visible, .touch-on) .glint { animation: glint .9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.17s); }
  @keyframes rustle { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes hammock { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(2px); } }
  @keyframes pwave { from { transform: translateX(0); } to { transform: translateX(40px); } }
  @keyframes glint { from { opacity: .25; } to { opacity: 1; } }

  /* photo backs */
  .face .photo.has-img { position: relative; overflow: hidden; border: none; padding: 0; min-height: 0; }
  .face .photo.has-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
  .face .photo.two img { animation: xfade 6s ease-in-out infinite; }
  .face .photo.two img:nth-child(2) { animation-delay: -3s; }
  @keyframes xfade { 0%, 42% { opacity: 1; } 55%, 92% { opacity: 0; } 100% { opacity: 1; } }
  .shot { width: 100%; aspect-ratio: 4 / 5; height: auto; object-fit: cover; border-radius: 18px; display: block; }

  /* new orleans */
  .card.nl .lampglow { transform-box: fill-box; transform-origin: center; }
  .card.nl .horn { transform-box: view-box; transform-origin: 96px 128px; }
  .card.nl:is(:hover, .touch-on) .note, .card.nl:is(:focus-visible, .touch-on) .note { animation: float 2.4s ease-out infinite; animation-delay: calc(var(--i) * -.8s); }
  .card.nl:is(:hover, .touch-on) .shim, .card.nl:is(:focus-visible, .touch-on) .shim { animation: shim .8s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.12s); }
  .card.nl:is(:hover, .touch-on) .lampglow, .card.nl:is(:focus-visible, .touch-on) .lampglow { animation: lampglow .5s ease-in-out infinite alternate; }
  .card.nl:is(:hover, .touch-on) .horn, .card.nl:is(:focus-visible, .touch-on) .horn { animation: hornbob .45s ease-in-out infinite alternate; }
  @keyframes shim { from { opacity: .25; } to { opacity: .85; } }
  @keyframes lampglow { from { opacity: .2; transform: scale(.9); } to { opacity: .55; transform: scale(1.12); } }
  @keyframes hornbob { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

  /* caribbean / atlantis */
  .card.cb .weed { transform-box: view-box; }
  .card.cb .ray { transform-box: view-box; transform-origin: 100px 34px; }
  .card.cb:is(:hover, .touch-on) .weed, .card.cb:is(:focus-visible, .touch-on) .weed { animation: weedsway 1.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.3s); }
  .card.cb:is(:hover, .touch-on) .fishin, .card.cb:is(:focus-visible, .touch-on) .fishin { animation: fishswim 2.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.5s); }
  .card.cb:is(:hover, .touch-on) .bub, .card.cb:is(:focus-visible, .touch-on) .bub { animation: bubrise 3s ease-in infinite; animation-delay: calc(var(--i) * -.33s); }
  .card.cb:is(:hover, .touch-on) .ray, .card.cb:is(:focus-visible, .touch-on) .ray { animation: raysway 3s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -1s); }
  .card.cb:is(:hover, .touch-on) .aglow, .card.cb:is(:focus-visible, .touch-on) .aglow { animation: glow2 1.8s ease-in-out infinite alternate; }
  @keyframes weedsway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes fishswim { from { transform: translateX(0); } to { transform: translateX(34px); } }
  @keyframes bubrise { 0% { transform: translateY(0); opacity: .6; } 100% { transform: translateY(-46px); opacity: 0; } }

function makeChicago() {
  const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  // [x, width, top]
  const blds = [[0,16,100],[14,18,78],[30,14,92],[64,16,96],[78,20,84],[96,14,104],[142,16,90],[156,18,74],[172,14,98],[184,16,86]];
  let sky = '', wins = '';
  blds.forEach(([x,w,t]) => { sky += `<rect x="${x}" y="${t}" width="${w}" height="${150 - t}" fill="#0f1a33"/>`; });
  const towers = [[44,20,60],[112,10,40],[122,10,54],[132,10,70]];
  towers.forEach(([x,w,t]) => { sky += `<rect x="${x}" y="${t}" width="${w}" height="${150 - t}" fill="#0b1429"/>`; });
  sky += '<g stroke="#0b1429" stroke-width="1.5"><line x1="49" y1="60" x2="49" y2="46"/><line x1="59" y1="60" x2="59" y2="46"/><line x1="115" y1="40" x2="115" y2="28"/><line x1="119" y1="40" x2="119" y2="31"/></g>';
  let n = 0;
  [...blds, ...towers].forEach(([x,w,t]) => {
    for (let yy = t + 6; yy < 104; yy += 7) for (let xx = x + 3; xx < x + w - 2; xx += 4.5) {
      if (rnd(n++, 3) > .62) wins += `<rect x="${xx.toFixed(1)}" y="${yy}" width="2" height="2.6" fill="#ffd98a" opacity=".85"/>`;
    }
  });
  let stars = '';
  for (let i = 0; i < 16; i++) stars += `<circle cx="${(rnd(i,8)*200).toFixed(0)}" cy="${(rnd(i,9)*52).toFixed(0)}" r="${(0.6 + rnd(i,10)).toFixed(1)}" fill="#fff" opacity=".7"/>`;

  return `

  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1736"/><stop offset=".6" stop-color="#1c4b8c"/><stop offset="1" stop-color="#f08a4b"/></linearGradient>
    <linearGradient id="csauce" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3412f"/><stop offset="1" stop-color="#a62a1e"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#csky)"/>
  ${stars}
  <circle cx="30" cy="30" r="9" fill="#fdf2d0" opacity=".9"/>
  ${sky}
  ${wins}
  <!-- elevated track -->
  <g>
    <rect x="0" y="108" width="200" height="5" fill="#1a2438"/>
    <rect x="0" y="113" width="200" height="2" fill="#0a1020"/>
    <g stroke="#1a2438" stroke-width="3"><line x1="22" y1="115" x2="22" y2="150"/><line x1="82" y1="115" x2="82" y2="150"/><line x1="142" y1="115" x2="142" y2="150"/><line x1="196" y1="115" x2="196" y2="150"/></g>

function makeVirginia() {

  const vp = [142, 150];
  let rows = '', leaves = '', grapes = '';
  [-30, 12, 54, 96, 138, 180, 222, 264].forEach((bx, ri) => {
    rows += `<line x1="${vp[0]}" y1="${vp[1]}" x2="${bx}" y2="200" stroke="#2a5c2e" stroke-width="2.4" stroke-linecap="round"/>`;
    for (let k = 0; k < 7; k++) {
      const t = .12 + k * .14 + rnd(ri * 7 + k, 1) * .04;
      const x = vp[0] + (bx - vp[0]) * t, y = vp[1] + (200 - vp[1]) * t, r = 1.2 + t * 3.4;

    }

  let flies = '';
  [[22,150],[56,164],[96,156],[126,176],[168,160],[184,182],[40,128]].forEach(([x, y], i) => {

function makeMontreal() {
  const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  const tans = ['#c9a87c', '#b99669', '#d6bb92', '#c2a074'];
  let boxes = '', n = 0;
  for (let r = 4; r >= 0; r--) {                      // top row first, bottom row last
    const count = 5 - r, x0 = 40 + r * 12, y = 86 - r * 13;
    for (let i = 0; i < count; i++) {
      n++;
      if (r > 0 && r < 4 && rnd(n, 1) > .84) continue;            // gaps, like the real building
      const x = x0 + i * 24 + Math.round((rnd(n, 2) - .5) * 5);
      const yy = y + Math.round((rnd(n, 3) - .5) * 4);
      const c = tans[Math.floor(rnd(n, 4) * tans.length)];
      boxes += `<g>
        <rect x="${x}" y="${yy}" width="22" height="14" fill="${c}"/>
        <rect x="${x + 18}" y="${yy}" width="4" height="14" fill="#000" opacity=".12"/>
        <rect x="${x - 1}" y="${yy - 3}" width="24" height="3" fill="#e6d3ae"/>
        <circle cx="${x + 4}" cy="${yy - 4}" r="1.6" fill="#4f8a4a"/><circle cx="${x + 9}" cy="${yy - 3.6}" r="1.2" fill="#6aa65c"/>
        <rect x="${x + 4}" y="${yy + 4}" width="11" height="6" fill="#3d556b"/>
        <line x1="${x + 9.5}" y1="${yy + 4}" x2="${x + 9.5}" y2="${yy + 10}" stroke="#c9a87c" stroke-width=".8"/>
      </g>`;
    }
  }
  // downtown skyline in the distance (drawn behind the far hill so the bases are hidden)
  const towersDef = [[0,12,74],[11,10,54],[22,14,40],[37,10,68],[58,12,60],[72,10,46],[95,12,26],[118,10,52],[138,12,62],[150,10,48],[164,14,34],[179,10,56],[189,11,72]];
  let skyline = '', sn = 0;
  towersDef.forEach(([x, w, t], k) => {
    skyline += `<rect x="${x}" y="${t}" width="${w}" height="${120 - t}" fill="${k % 3 === 0 ? '#9db5cc' : '#a9bfd4'}"/><rect x="${x + w - 2.5}" y="${t}" width="2.5" height="${120 - t}" fill="#8aa3bd" opacity=".7"/>`;
    if (k % 3 === 2) skyline += `<line x1="${x + w / 2}" y1="${t}" x2="${x + w / 2}" y2="${t - 9}" stroke="#9db5cc" stroke-width="1.3"/>`;
    for (let yy = t + 5; yy < 96; yy += 6) for (let xx = x + 2; xx < x + w - 3; xx += 3.8) {
      if (rnd(sn++, 3) > .45) skyline += `<rect x="${xx.toFixed(1)}" y="${yy}" width="1.6" height="2.2" fill="#dbe8f2" opacity=".6"/>`;
    }
  });
  const wave = (y, cls, w = 2) => `<path class="wave ${cls}" d="M-70 ${y} q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round" opacity=".85"/>`;
  return `
<svg viewBox="0 0 200 200" role="img" aria-label="Habitat 67 on a green hill above the St. Lawrence rapids in Montreal">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb7ea"/><stop offset="1" stop-color="#dff1fb"/></linearGradient>
    <linearGradient id="mwater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9bc6"/><stop offset="1" stop-color="#17608c"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#msky)"/>
  <g fill="#fff" opacity=".85"><ellipse cx="156" cy="24" rx="22" ry="5.5"/><ellipse cx="30" cy="30" rx="18" ry="5"/></g>
  ${skyline}
  <path d="M0 100 Q50 82 100 94 Q150 78 200 98 L200 130 L0 130 Z" fill="#a8c9a6"/>
  <rect x="0" y="134" width="200" height="66" fill="url(#mwater)"/>

  <path d="M0 144 Q50 140 100 146 Q150 152 200 144 L200 149 Q150 157 100 151 Q50 145 0 149 Z" fill="#3f7a3b"/>
  <!-- rapids -->
  ${wave(160, 'w1')}${wave(172, 'w2', 2.4)}${wave(184, 'w3')}${wave(194, 'w4', 1.8)}
</svg>`;
}

function makeMexico() {
  const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  // papel picado flags along a sagging string
  const P0 = [-5, 36], P1 = [100, 66], P2 = [205, 38], fc = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#f78c6b'];
  let flags = '';
  for (let k = 0; k < 11; k++) {
    const t = .05 + k * .09, u = 1 - t;
    const x = u*u*P0[0] + 2*u*t*P1[0] + t*t*P2[0], y = u*u*P0[1] + 2*u*t*P1[1] + t*t*P2[1];
    flags += `<g class="flag" style="--i:${k}"><polygon points="${(x-6).toFixed(1)},${y.toFixed(1)} ${(x+6).toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${(y+14).toFixed(1)}" fill="${fc[k % 5]}"/><circle cx="${x.toFixed(1)}" cy="${(y+4.5).toFixed(1)}" r="1.4" fill="#fff" opacity=".7"/></g>`;
  }
  // cobblestones, bigger toward the viewer
  let stones = '', n = 0;
  const pal = ['#8a7566', '#a08b7a', '#76655a', '#b09b8a', '#94806f'];
  for (let r = 0; r < 5; r++) {

/* ---------- Honduras: jungle and a street full of hanging lampshades ---------- */
function makeHonduras() {
  const f = v => v.toFixed(1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const pal = ['#e63946', '#ff8a3d', '#ffd23f', '#2b6cb0', '#2fb5a8', '#8e44ad', '#ff5da2', '#ffffff', '#7fcf5a', '#ff7a7a'];
  const ptL = (x, v) => { const t = x / 78, top = lerp(40, 92, t), bot = lerp(190, 150, t); return `${f(x)},${f(top + v * (bot - top))}`; };
  const quad = (x1, x2, v1, v2, side) => { const m = x => side === 'L' ? x : 200 - x; const p = (x, v) => ptL(x, v).split(',').map(Number); const a = p(x1, v1), b = p(x2, v1), c = p(x2, v2), d = p(x1, v2);
    return [a, b, c, d].map(([x, y]) => `${f(m(x))},${f(y)}`).join(' '); };
  let walls = '', shades = '', foliage = '', bricks = '';
  [[8, 18], [26, 36], [44, 52], [58, 66]].forEach(([a, b]) => { ['L', 'R'].forEach(sd => { walls += `<polygon points="${quad(a - 1.5, b + 1.5, .26, .66, sd)}" fill="#fff"/><polygon points="${quad(a, b, .3, .62, sd)}" fill="#4a2f2a"/>`; }); });
  [[14, 24], [48, 58]].forEach(([a, b]) => { ['L', 'R'].forEach(sd => { walls += `<polygon points="${quad(a, b, .7, .98, sd)}" fill="#7a4a2a"/>`; }); });
  const sh = [];
  for (let i = 0; i < 80; i++) { const d = Math.pow(rndOf(i, 1), .75); sh.push({ i, d }); }
  sh.sort((p, q) => q.d - p.d).forEach(({ i, d }) => {
    const x = 100 + (rndOf(i, 2) - .5) * lerp(210, 20, d), y = lerp(2, 100, d) + (rndOf(i, 3) - .5) * 6, w = lerp(17, 3.4, d), h = w * .9, c = pal[Math.floor(rndOf(i, 4) * pal.length)];
    shades += `<g class="shade" style="--i:${i % 9};transform-origin:${f(x)}px ${f(y - h * 1.6)}px"><line x1="${f(x)}" y1="${f(y - h * 1.6)}" x2="${f(x)}" y2="${f(y - h * .2)}" stroke="#fff" stroke-width=".7" opacity=".7"/><polygon points="${f(x - w * .35)},${f(y - h * .2)} ${f(x + w * .35)},${f(y - h * .2)} ${f(x + w * .55)},${f(y + h * .7)} ${f(x - w * .55)},${f(y + h * .7)}" fill="${c}"/><ellipse cx="${f(x)}" cy="${f(y + h * .7)}" rx="${f(w * .55)}" ry="${f(w * .13)}" fill="#000" opacity=".18"/></g>`;
  });
  for (let i = 0; i < 16; i++) foliage += `<circle cx="${f(70 + rndOf(i, 5) * 60)}" cy="${f(96 + rndOf(i, 6) * 40)}" r="${f(8 + rndOf(i, 7) * 12)}" fill="${['#2f7a3a', '#3f9a4a', '#1f5a2c'][i % 3]}"/>`;
  for (let k = 0; k < 6; k++) { const y = 150 + k * 9; bricks += `<line x1="${f(lerp(78, 0, (y - 150) / 40))}" y1="${y}" x2="${f(lerp(122, 200, (y - 150) / 40))}" y2="${y}" stroke="#a8685a" stroke-width="1"/>`; }
  for (let k = -4; k <= 4; k++) bricks += `<line x1="${100 + k * 5}" y1="150" x2="${100 + k * 28}" y2="200" stroke="#a8685a" stroke-width="1"/>`;
  return `

  <polygon points="0,40 78,92 78,150 0,190" fill="#f3d46a"/><polygon points="200,40 122,92 122,150 200,190" fill="#a8d6ec"/>
  <polygon points="0,120 78,126 78,150 0,190" fill="#000" opacity=".06"/>${walls}
  <polygon points="0,190 78,150 122,150 200,190 200,200 0,200" fill="#c98a7a"/>${bricks}
  <rect x="21" y="102" width="3.4" height="88" fill="#2f6b4a"/><path d="M16 96 L29 96 L27 106 L18 106 Z" fill="#ffe9a8" stroke="#2f6b4a" stroke-width="2"/><polygon points="14,96 22.5,88 31,96" fill="#2f6b4a"/><circle cx="22.5" cy="101" r="9" fill="#ffe9a8" opacity=".35"/>

    const p1 = P(a, 1), p2 = P(b, 0), p3 = P(a, 0), p4 = P(b, 1); net += `<line x1="${f(m(p1[0]))}" y1="${f(p1[1])}" x2="${f(m(p2[0]))}" y2="${f(p2[1])}" stroke="#c46a5a" stroke-width=".6" opacity=".8"/><line x1="${f(m(p3[0]))}" y1="${f(p3[1])}" x2="${f(m(p4[0]))}" y2="${f(p4[1])}" stroke="#c46a5a" stroke-width=".6" opacity=".8"/>`; }); });

  return `

/* ---------- Guatemala: Antigua's yellow arch with the erupting volcano behind it ---------- */
function makeVolcano() {
  const f = v => v.toFixed(1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const CX = 84, CY = 44;
  const colors = ['#ffe27a', '#ffb347', '#ff7a3d', '#ff4a1c'];
  let bombs = '', cobbles = '', winsL = '', winsR = '';
  for (let i = 0; i < 40; i++) {
    const dx = Math.round((rndOf(i, 1) - .5) * 160), h = Math.round(26 + rndOf(i, 2) * 44), fl = Math.round(40 + rndOf(i, 3) * 55);
    const t = (1.3 + rndOf(i, 4) * .6).toFixed(2), d = (rndOf(i, 5) * .9).toFixed(2), r = (1.8 + rndOf(i, 6) * 3).toFixed(1), c = colors[Math.floor(rndOf(i, 7) * colors.length)];
    bombs += `<g class="bx" style="--dx:${dx}px;--t:${t}s;--d:${d}s"><circle class="bomb" cx="${CX}" cy="${CY}" r="${r}" fill="${c}" style="--h:${h};--f:${fl};--t:${t}s;--d:${d}s"/></g>`;
  }
  for (let k = 0; k < 5; k++) { const y = 174 + k * 6; cobbles += `<line x1="${f(lerp(60, 0, (y - 170) / 30))}" y1="${y}" x2="${f(lerp(140, 200, (y - 170) / 30))}" y2="${y}" stroke="#5a4766" stroke-width="1"/>`; }
  for (let k = -4; k <= 4; k++) cobbles += `<line x1="${100 + k * 8}" y1="170" x2="${100 + k * 34}" y2="200" stroke="#5a4766" stroke-width="1"/>`;
  const wq = (side, x1, x2, v1, v2) => { const top = x => lerp(30, 100, x / 60), bot = x => lerp(200, 170, x / 60); const m = x => side === 'L' ? x : 200 - x; const P = (x, v) => [m(x), top(x) + v * (bot(x) - top(x))]; return [P(x1, v1), P(x2, v1), P(x2, v2), P(x1, v2)].map(p => `${f(p[0])},${f(p[1])}`).join(' '); };
  [[6, 16], [20, 28], [34, 42]].forEach(([a, b]) => { winsL += `<polygon points="${wq('L', a, b, .3, .58)}" fill="#2a4a5a"/>`; });
  [[8, 18], [26, 36], [44, 54]].forEach(([a, b]) => { winsR += `<path d="M0 0" /><polygon points="${wq('R', a, b, .32, .62)}" fill="#4a2a1f"/>`; });
  return `

  <defs>
    <linearGradient id="gtsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a72"/><stop offset=".5" stop-color="#bb5aa0"/><stop offset="1" stop-color="#ffb48a"/></linearGradient>
    <radialGradient id="fl"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffb347" stop-opacity=".8"/><stop offset="1" stop-color="#ff5a28" stop-opacity="0"/></radialGradient>
    <linearGradient id="jt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4a1c"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#gtsky)"/>
  <g fill="#ff9ac0" opacity=".55"><ellipse cx="150" cy="36" rx="38" ry="5"/><ellipse cx="40" cy="26" rx="30" ry="4"/><ellipse cx="170" cy="62" rx="26" ry="4"/></g>
  <circle class="smoke" cx="${CX}" cy="${CY - 14}" r="12"/><circle class="smoke" cx="${CX + 14}" cy="${CY - 24}" r="8"/><circle class="smoke" cx="${CX - 12}" cy="${CY - 26}" r="7"/>
  <ellipse class="crater-glow" cx="${CX}" cy="${CY + 8}" rx="40" ry="22" fill="#ff7a3d" opacity=".3"/>
  <path d="M10 126 Q56 98 76 48 Q84 38 92 48 Q112 98 160 126 Z" fill="#4a3f7e"/><path d="M10 126 Q56 98 76 48 Q80 42 84 40 Q70 90 38 120 Z" fill="#5c509a" opacity=".8"/><path d="M92 48 Q112 98 160 126 L120 126 Q104 96 88 44 Z" fill="#372e66" opacity=".8"/>
  <path class="flow halo" pathLength="100" d="M78 48 Q68 82 42 110"/><path class="flow halo" pathLength="100" d="M90 48 Q100 82 128 110"/><path class="flow core" pathLength="100" d="M78 48 Q68 82 42 110"/><path class="flow core" pathLength="100" d="M90 48 Q100 82 128 110"/>
  <ellipse cx="${CX}" cy="${CY + 3}" rx="9" ry="3.4" fill="#ff7a3d"/><ellipse cx="${CX}" cy="${CY + 3}" rx="5" ry="2" fill="#ffd877"/>
  <path class="jet" d="M${CX - 6} ${CY + 3} Q${CX - 2} ${CY - 22} ${CX} ${CY - 42} Q${CX + 2} ${CY - 22} ${CX + 6} ${CY + 3} Z" fill="url(#jt)"/>
  <circle class="flash" cx="${CX}" cy="${CY + 3}" r="30" fill="url(#fl)"/>

  <polygon points="0,200 60,170 140,170 200,200" fill="#7a6580"/>${cobbles}

  ${bombs}

}

places.forEach(p => {
  const route = '/loves/travel/' + p.slug;
  if (p.page) pages[route] = { title: p.name.toLowerCase(), html: () => detail(p.title || p.name, p.page, p.photos || []) };
  else if (!pages[route] && p.title) pages[route] = { title: p.name.toLowerCase(), html: () => detail(p.title, p.hint, p.photos || []) };
});

/* ---------- router + shared page transition ---------- */
const view = document.getElementById('view');
const curtain = document.getElementById('curtain');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const routeOf = () => (location.hash.replace(/^#/, '') || '/');
let busy = false, pending = null, current = routeOf();

function render(route) {
  const page = pages[route] || pages['/'];
  view.classList.toggle('wide', route === '/loves/travel');
  view.innerHTML = page.html();
  document.title = route === '/' ? 'Hannah Young' : page.title + ' | Hannah Young';
  document.querySelectorAll('nav ul a').forEach(a => {
    const href = a.getAttribute('href').slice(1);
    route.startsWith(href) ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  wireCards();
  startSlides();
}

document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});

document.addEventListener('pointerdown', e => {
  if (!matchMedia('(hover: none)').matches) return;
  document.querySelectorAll('.card.touch-on').forEach(c => { if (!c.contains(e.target)) { c.classList.remove('touch-on'); c._stop && c._stop(); } });
});

let slideTimers = [];
function startSlides() {
  slideTimers.forEach(clearInterval); slideTimers = [];
  view.querySelectorAll('.photo.multi').forEach(box => {
    const imgs = [...box.querySelectorAll('img')]; let i = 0;
    imgs.forEach((im, k) => im.classList.toggle('on', k === 0));
    slideTimers.push(setInterval(() => { imgs[i].classList.remove('on'); i = (i + 1) % imgs.length; imgs[i].classList.add('on'); }, 3000));
  });
}

function wireCards() {
  view.querySelectorAll('.card[data-flip]').forEach(c => {
    const delay = +c.dataset.flip;
    let flipTimer, resetTimer, held = false;
    const start = () => {
      clearTimeout(resetTimer); clearTimeout(flipTimer);
      if (c.classList.contains('gt')) c.classList.add('erupt');
      if (!held) flipTimer = setTimeout(() => c.classList.add('flipped'), delay);   // let the animation play, then flip
    };
    const stop = () => {
      held = false;
      clearTimeout(flipTimer);
      c.classList.remove('flipped');
      resetTimer = setTimeout(() => c.classList.remove('erupt'), 700);
    };
    ['mouseenter', 'focus'].forEach(e => c.addEventListener(e, start));
    c._stop = stop;
    if (!c.hasAttribute('href')) {            // food tiles: click (or Enter / Space) flips right away, and again to flip back
      const toggle = () => { clearTimeout(flipTimer); held = true; c.classList.toggle('flipped'); };
      c.addEventListener('click', toggle);
      c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    }
    ['mouseleave', 'blur'].forEach(e => c.addEventListener(e, () => { if (matchMedia('(hover: none)').matches) return; c.classList.remove('touch-on'); stop(); }));
    // phones and tablets (no hover): the first tap plays the animation and flip, the second tap opens the page
    c.addEventListener('click', e => {
      if (!matchMedia('(hover: none)').matches) return;
      if (!c.classList.contains('touch-on')) {
        e.preventDefault(); e.stopPropagation();
        view.querySelectorAll('.card.touch-on').forEach(o => { if (o !== c) { o.classList.remove('touch-on'); o._stop && o._stop(); } });
        c.classList.add('touch-on');
        start();
      }
    }, true);
  });
}

async function go(route) {
  if (route === current && !busy) return;
  if (busy) { pending = route; return; }
  busy = true;
  current = route;
  try {
    if (reduce) { render(route); return; }
    const page = pages[route] || pages['/'];
    curtain.textContent = route === '/' ? 'hannah young' : page.title;
    const opts = { duration: 520, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' };
    await curtain.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], opts).finished;
    render(route);
    await new Promise(r => setTimeout(r, 120));
    await curtain.animate([{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 0 100%)' }], opts).finished;
  } catch (err) {
    render(route);               // if an animation is interrupted, still show the page
  } finally {
    busy = false;
    if (pending && pending !== current) { const next = pending; pending = null; go(next); }
    pending = null;
  }
}

/* links: handle clicks directly so navigation works in any preview or host */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const route = a.getAttribute('href').slice(1);
  try { history.pushState(null, '', '#' + route); } catch (_) {}
  go(route);
});
window.addEventListener('popstate', () => go(routeOf()));
window.addEventListener('hashchange', () => go(routeOf()));

render(current);
</script>
