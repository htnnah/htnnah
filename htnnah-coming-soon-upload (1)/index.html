<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8a6971" />
  <title>Hannah Young</title>

  <style>
    :root {
      --cream: #f7efe3;
      --dot: #ffd0a3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      background: #8a6971;
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    /* Full background */
    .background,
    .palm-layer {
      position: absolute;
      inset: -2%;
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .background {
      z-index: -4;
      transform: scale(1.025);
      animation: slow-drift 28s ease-in-out infinite alternate;
    }

    /*
      These two layers reuse the same image but only show the left and right
      edges. That lets the palms appear to sway independently.
    */
    .palm-layer {
      z-index: -3;
      transform-origin: bottom center;
      will-change: transform;
    }

    .palm-left {
      clip-path: polygon(0 0, 36% 0, 36% 100%, 0 100%);
      animation: sway-left 8.5s ease-in-out infinite alternate;
    }

    .palm-right {
      clip-path: polygon(64% 0, 100% 0, 100% 100%, 64% 100%);
      animation: sway-right 10s ease-in-out .7s infinite alternate;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 48%, transparent 23%, rgba(28, 17, 24, .06) 68%, rgba(28, 17, 24, .16) 100%);
      pointer-events: none;
    }

    .content {
      width: min(92vw, 1080px);
      padding: clamp(20px, 4vw, 52px);
      text-align: center;
      transform: translateY(-1.5vh);
    }

    h1 {
      margin: 0;
      font-family: "Times New Roman", Georgia, serif;
      font-size: clamp(4.4rem, 10.2vw, 9.5rem);
      font-weight: 300;
      line-height: .94;
      letter-spacing: -.045em;
      color: var(--cream);
      text-wrap: balance;
      text-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    }

    .message {
      margin: 28px 0 0;
      font-size: clamp(.8rem, 1.45vw, 1.08rem);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: .34em;
      text-transform: lowercase;
      color: rgba(247, 239, 227, .9);
      text-shadow: 0 4px 16px rgba(0, 0, 0, .15);
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
    }

    .loader span {
      width: 11px;
      height: 11px;
      border: 1px solid rgba(255, 240, 224, .65);
      border-radius: 50%;
      background: transparent;
      opacity: .45;
      animation: dot-pulse 1.35s ease-in-out infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: .18s;
    }

    .loader span:nth-child(3) {
      animation-delay: .36s;
    }

    @keyframes dot-pulse {
      0%, 60%, 100% {
        opacity: .42;
        background: transparent;
        border-color: rgba(255, 240, 224, .55);
        box-shadow: none;
        transform: scale(.92);
      }

      30% {
        opacity: 1;
        background: var(--dot);
        border-color: var(--dot);
        box-shadow:
          0 0 12px rgba(255, 190, 132, .95),
          0 0 28px rgba(255, 163, 94, .42);
        transform: scale(1.08);
      }
    }

    @keyframes slow-drift {
      from {
        transform: scale(1.025) translate3d(-.25%, 0, 0);
      }

      to {
        transform: scale(1.045) translate3d(.25%, -.25%, 0);
      }
    }

    @keyframes sway-left {
      from {
        transform: scale(1.025) rotate(-.45deg) translate3d(-.12%, 0, 0);
      }

      to {
        transform: scale(1.028) rotate(.55deg) translate3d(.15%, -.08%, 0);
      }
    }

    @keyframes sway-right {
      from {
        transform: scale(1.025) rotate(.5deg) translate3d(.12%, 0, 0);
      }

      to {
        transform: scale(1.028) rotate(-.45deg) translate3d(-.13%, -.08%, 0);
      }
    }

    @media (max-width: 700px) {
      .background,
      .palm-layer {
        background-position: center;
      }

      .content {
        width: 95vw;
        padding-inline: 18px;
      }

      h1 {
        font-size: clamp(3.4rem, 16vw, 6.3rem);
        letter-spacing: -.035em;
      }

      .message {
        margin-top: 22px;
        font-size: .77rem;
        letter-spacing: .2em;
      }

      .loader {
        margin-top: 18px;
        gap: 11px;
      }

      .loader span {
        width: 9px;
        height: 9px;
      }
    }

    @media (max-height: 640px) {
      .content {
        transform: none;
      }

      h1 {
        font-size: clamp(3rem, 12vh, 6rem);
      }

      .message {
        margin-top: 16px;
      }

      .loader {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .background,
      .palm-layer,
      .loader span {
        animation: none;
      }

      .loader span:first-child {
        opacity: 1;
        background: var(--dot);
        border-color: var(--dot);
        box-shadow: 0 0 16px rgba(255, 190, 132, .8);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="background" aria-hidden="true"></div>
    <div class="palm-layer palm-left" aria-hidden="true"></div>
    <div class="palm-layer palm-right" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>

    <section class="content">
      <h1>Hannah Young</h1>
      <p class="message">working on something special</p>

      <div class="loader" aria-label="Loading">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>
</body>
</html>
